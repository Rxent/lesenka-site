<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="Лисёнок Лесик с книгой стоит на лесенке">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE7C8"/>
      <stop offset="100%" stop-color="#FFF6EB"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft circle background -->
  <circle cx="240" cy="240" r="220" fill="url(#bg)"/>

  <!-- ladder behind -->
  <g stroke="#C68A4D" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="120" y1="380" x2="170" y2="170"/>
    <line x1="220" y1="380" x2="270" y2="170"/>
    <line x1="135" y1="320" x2="225" y2="320"/>
    <line x1="150" y1="270" x2="240" y2="270"/>
    <line x1="160" y1="225" x2="250" y2="225"/>
  </g>

  <!-- shadow under fox -->
  <ellipse cx="320" cy="400" rx="90" ry="14" fill="url(#shadow)"/>

  <!-- fox body -->
  <g>
    <!-- tail -->
    <path d="M380 330 Q430 280 415 230 Q395 215 380 240 Q370 280 360 320 Z" fill="#F4A24B"/>
    <path d="M395 230 Q410 240 410 260 Q400 252 392 248 Z" fill="#FFF6EB"/>

    <!-- back legs -->
    <ellipse cx="290" cy="395" rx="22" ry="16" fill="#E8782C"/>
    <ellipse cx="345" cy="395" rx="22" ry="16" fill="#E8782C"/>

    <!-- body -->
    <path d="M250 330 Q250 270 320 270 Q390 270 390 330 Q390 395 320 395 Q250 395 250 330 Z" fill="#F4A24B"/>
    <!-- belly -->
    <ellipse cx="320" cy="355" rx="45" ry="35" fill="#FFF6EB"/>

    <!-- head -->
    <path d="M250 230 Q260 170 320 170 Q380 170 390 230 Q390 280 320 290 Q250 280 250 230 Z" fill="#F4A24B"/>

    <!-- ears -->
    <path d="M260 195 L245 145 L285 175 Z" fill="#F4A24B"/>
    <path d="M380 195 L395 145 L355 175 Z" fill="#F4A24B"/>
    <path d="M268 190 L260 162 L278 178 Z" fill="#2D2A26"/>
    <path d="M372 190 L380 162 L362 178 Z" fill="#2D2A26"/>

    <!-- white face mask -->
    <path d="M280 230 Q280 200 320 200 Q360 200 360 230 Q360 265 320 275 Q280 265 280 230 Z" fill="#FFF6EB"/>

    <!-- eyes -->
    <circle cx="300" cy="225" r="6" fill="#2D2A26"/>
    <circle cx="340" cy="225" r="6" fill="#2D2A26"/>
    <circle cx="302" cy="223" r="2" fill="#FFF"/>
    <circle cx="342" cy="223" r="2" fill="#FFF"/>

    <!-- cheeks -->
    <circle cx="285" cy="248" r="6" fill="#FFB6B6" opacity="0.6"/>
    <circle cx="355" cy="248" r="6" fill="#FFB6B6" opacity="0.6"/>

    <!-- nose -->
    <path d="M315 245 Q320 240 325 245 Q325 252 320 254 Q315 252 315 245 Z" fill="#2D2A26"/>
    <!-- mouth -->
    <path d="M320 254 Q320 262 313 264 M320 254 Q320 262 327 264" stroke="#2D2A26" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- front paws holding book -->
    <ellipse cx="295" cy="345" rx="14" ry="20" fill="#E8782C"/>
    <ellipse cx="345" cy="345" rx="14" ry="20" fill="#E8782C"/>

    <!-- book -->
    <rect x="285" y="335" width="70" height="40" rx="4" fill="#8FBE74"/>
    <rect x="285" y="335" width="70" height="6" rx="2" fill="#6FA458"/>
    <line x1="320" y1="335" x2="320" y2="375" stroke="#FFF6EB" stroke-width="1.5"/>
    <line x1="295" y1="350" x2="312" y2="350" stroke="#FFF6EB" stroke-width="1.2"/>
    <line x1="295" y1="358" x2="312" y2="358" stroke="#FFF6EB" stroke-width="1.2"/>
    <line x1="328" y1="350" x2="345" y2="350" stroke="#FFF6EB" stroke-width="1.2"/>
    <line x1="328" y1="358" x2="345" y2="358" stroke="#FFF6EB" stroke-width="1.2"/>
  </g>

  <!-- floating stars -->
  <g fill="#F4A24B">
    <path d="M90 130 l4 8 l8 1 l-6 6 l1 8 l-7-4 l-7 4 l1-8 l-6-6 l8-1 z"/>
    <path d="M410 110 l3 6 l6 1 l-4 4 l1 6 l-6-3 l-5 3 l1-6 l-5-4 l6-1 z" opacity="0.85"/>
    <path d="M75 350 l3 5 l5 1 l-4 4 l1 5 l-5-3 l-4 3 l1-5 l-4-4 l5-1 z" opacity="0.8"/>
  </g>
</svg>
